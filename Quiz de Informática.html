<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz de Informática</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mut:#5d6b85;--bd:#d5dbe8;--ac:#2f5bea;--ok:#1f9d55;--okbg:#e5f6ec;--er:#d93a3a;--erbg:#fdeaea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#1a2133;--tx:#e8ecf5;--mut:#9aa7c2;--bd:#2c3752;--ac:#6c8cff;--ok:#3ecf7e;--okbg:#14301f;--er:#ff6b6b;--erbg:#3a1a1a}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#1a2133;--tx:#e8ecf5;--mut:#9aa7c2;--bd:#2c3752;--ac:#6c8cff;--ok:#3ecf7e;--okbg:#14301f;--er:#ff6b6b;--erbg:#3a1a1a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.wrap{width:100%;max-width:760px}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .4s}
.cnt{color:var(--mut);font-size:.9rem;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:clamp(18px,4vw,36px)}
h1{margin:0 0 12px;font-size:clamp(1.3rem,3.5vw,1.8rem);line-height:1.3}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:clamp(1rem,2.5vw,1.15rem);color:var(--tx);background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:14px 16px;margin-top:10px;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.bad{background:var(--erbg);border-color:var(--er);color:var(--er);cursor:not-allowed}
.opt.good{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt:disabled{cursor:default}
.com{margin-top:18px;padding:14px 16px;border-left:5px solid var(--ok);background:var(--okbg);border-radius:8px;line-height:1.55;display:none}
.btn{margin-top:18px;display:none;font:inherit;font-weight:600;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 24px;cursor:pointer}
.show{display:block}
.end{text-align:center}
.end p{color:var(--mut);font-size:1.1rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><i id="pb"></i></div>
  <div class="cnt" id="cnt"></div>
  <div class="card" id="card"></div>
</div>
<script>
const Q=[
{q:"O que significa a sigla CPU?",o:["Central de Programas Úteis","Unidade Central de Processamento","Controle Principal do Usuário","Cabo de Porta Universal"],c:1,m:"A CPU é o \"cérebro\" do computador: executa as instruções dos programas e coordena os demais componentes."},
{q:"Qual das memórias abaixo é volátil, ou seja, perde os dados ao desligar o computador?",o:["HD","SSD","Memória RAM","Pen drive"],c:2,m:"A RAM guarda temporariamente o que está em uso. HD, SSD e pen drive são armazenamento permanente."},
{q:"Qual é a extensão padrão de uma planilha do Excel atual?",o:[".docx",".pptx",".xlsx",".pdf"],c:2,m:".xlsx é o formato do Excel. .docx é do Word e .pptx é do PowerPoint."},
{q:"Qual atalho de teclado é usado para COPIAR um item selecionado no Windows?",o:["Ctrl + V","Ctrl + C","Ctrl + X","Ctrl + Z"],c:1,m:"Ctrl+C copia, Ctrl+V cola, Ctrl+X recorta e Ctrl+Z desfaz a última ação."},
{q:"Qual dos dispositivos abaixo é considerado de SAÍDA?",o:["Teclado","Mouse","Scanner","Impressora"],c:3,m:"Dispositivos de saída entregam ao usuário o resultado do processamento, como monitor e impressora. Teclado, mouse e scanner são de entrada."},
{q:"Quantos bits formam 1 byte?",o:["4","8","16","10"],c:1,m:"1 byte = 8 bits. É a unidade básica para medir armazenamento (KB, MB, GB...)."},
{q:"Qual dos itens abaixo é um navegador de internet?",o:["Google Chrome","Windows","Word","WhatsApp"],c:0,m:"Navegadores (Chrome, Firefox, Edge, Safari) exibem páginas da web. Windows é um sistema operacional e Word é um editor de textos."},
{q:"Qual dessas senhas é a mais segura?",o:["12345678","meunome2000","senha123","T#9vL!q2mRz7"],c:3,m:"Senhas fortes são longas e misturam letras maiúsculas, minúsculas, números e símbolos, sem dados pessoais ou sequências óbvias."}
];
function M(q,o,c,m){return{q,o,c,m}}
function V(q,v,m){return{q:"Verdadeiro ou Falso: "+q,o:["Verdadeiro","Falso"],c:v?0:1,m}}
Q.push(
 M("Qual tecla é utilizada para apagar o caractere localizado à esquerda do cursor?",["Delete","Shift","Backspace","Esc"],2,"O Backspace (←) apaga o caractere à esquerda do cursor, voltando uma posição."),
 M("Qual tecla serve para apagar o caractere localizado à direita do cursor?",["Delete","Enter","Tab","Alt"],0,"O Delete apaga o caractere à direita do cursor. No gerenciador de arquivos, também envia o item selecionado para a lixeira."),
 M("Qual tecla é utilizada para confirmar comandos ou iniciar uma nova linha?",["Shift","Esc","Enter","Ctrl"],2,"O Enter confirma comandos e, em editores de texto, cria uma nova linha ou parágrafo."),
 M("A tecla Tab é utilizada principalmente para:",["Fechar programas.","Mover o cursor para o próximo campo ou criar recuo em textos.","Reiniciar o computador.","Apagar arquivos."],1,"O Tab avança entre campos de um formulário e cria recuo (tabulação) em textos."),
 M("Qual tecla permite escrever letras maiúsculas temporariamente quando mantida pressionada?",["Num Lock","Caps Lock","Shift","Ctrl"],2,"Enquanto o Shift está pressionado, as letras saem maiúsculas. Ao soltar, volta ao normal."),
 M("A tecla Caps Lock serve para:",["Ativar letras maiúsculas continuamente.","Abrir programas.","Fechar janelas.","Salvar documentos."],0,"O Caps Lock trava as letras em maiúsculo até ser pressionado novamente."),
 M("Qual tecla é utilizada para cancelar uma ação ou fechar menus?",["Delete","Esc","Home","Insert"],1,"Esc vem de Escape: cancela operações, fecha menus e caixas de diálogo."),
 M("As teclas Ctrl, Alt e Shift são classificadas como:",["Teclas numéricas.","Teclas multimídia.","Teclas modificadoras.","Teclas de função."],2,"Elas modificam o efeito de outras teclas quando usadas em combinação, como em Ctrl+C ou Alt+Tab."),
 M("Qual tecla ativa ou desativa o teclado numérico?",["Scroll Lock","Num Lock","Caps Lock","Shift"],1,"Com o Num Lock ativado, o teclado numérico digita números. Desativado, ele funciona como setas e navegação."),
 M("As teclas F1 até F12 são chamadas de:",["Teclas especiais.","Teclas de função.","Teclas alfabéticas.","Teclas multimídia."],1,"São as teclas de função, e cada programa pode atribuir a elas ações diferentes."),
 M("Qual tecla normalmente abre a ajuda de um programa?",["F1","F5","F8","F12"],0,"F1 é o padrão para abrir a Ajuda na maioria dos programas."),
 M("A tecla Espaço (Space) é utilizada para:",["Apagar palavras.","Inserir um espaço entre caracteres ou palavras.","Abrir arquivos.","Fechar programas."],1,"A barra de espaço insere um espaço em branco entre caracteres ou palavras."),
 M("A tecla Home posiciona o cursor:",["No final da linha.","No início da linha.","No meio do texto.","No início da página."],1,"Home leva o cursor ao início da linha. Com Ctrl+Home, vai ao início do documento."),
 M("A tecla End posiciona o cursor:",["No início da linha.","No final da linha.","No topo da página.","No início do documento."],1,"End leva o cursor ao final da linha. Com Ctrl+End, vai ao final do documento."),
 M("Qual tecla permite inserir caracteres sem apagar os existentes quando o modo Inserção está ativo?",["Delete","Insert","Esc","Shift"],1,"A tecla Insert alterna entre inserir e sobrescrever texto. No modo inserção, o texto novo empurra o existente."),
 M("As teclas direcionais servem para:",["Ajustar o volume.","Mover o cursor ou navegar pela tela.","Reiniciar o computador.","Abrir programas."],1,"As setas movem o cursor ou a seleção para cima, baixo, esquerda e direita."),
 M("A tecla Print Screen é utilizada para:",["Imprimir automaticamente um documento.","Capturar a imagem da tela.","Abrir a impressora.","Salvar arquivos."],1,"Print Screen captura a imagem da tela, apesar do nome. Ela não imprime nada."),
 M("Qual tecla geralmente abre o menu Iniciar do Windows?",["Ctrl","Windows (⊞)","Alt","Tab"],1,"A tecla Windows (⊞) abre o menu Iniciar e também é base de vários atalhos, como Windows+E."),
 M("Qual tecla é utilizada para acessar opções alternativas em combinação com outras teclas?",["Alt","Enter","Delete","Home"],0,"O Alt (Alternate) dá acesso a menus e comandos alternativos, como em Alt+Tab ou Alt+F4."),
 M("Em um teclado padrão ABNT2, qual tecla é utilizada para digitar caracteres especiais como \"ç\" e acentos em conjunto com outras teclas?",["Backspace","Enter","Teclas de acentuação (teclas mortas)","Esc"],2,"As teclas mortas (´ ` ~ ^ ¨) não mostram nada sozinhas e combinam com a letra seguinte, formando á, à, ã, â, ü."),
 V("Ctrl + C é utilizado para copiar um texto ou arquivo selecionado.",1,"Verdadeiro. Ctrl+C copia e Ctrl+V cola."),
 V("A tecla Backspace apaga o caractere localizado à direita do cursor.",0,"Falso. O Backspace apaga o caractere à esquerda. Quem apaga à direita é o Delete."),
 V("A tecla Enter pode ser utilizada para confirmar comandos ou iniciar uma nova linha em um editor de texto.",1,"Verdadeiro. O Enter tem as duas funções, conforme o contexto."),
 V("O atalho Ctrl + Z serve para desfazer a última ação realizada.",1,"Verdadeiro. Ctrl+Z desfaz, e Ctrl+Y refaz a ação desfeita."),
 V("A tecla Caps Lock deve permanecer pressionada para escrever uma única letra maiúscula.",0,"Falso. O Caps Lock é uma tecla de trava: pressiona-se uma vez para ativar. Para uma única maiúscula, usa-se o Shift."),
 V("O atalho Alt + Tab permite alternar entre programas e janelas abertas.",1,"Verdadeiro. Alt+Tab troca rapidamente de janela."),
 V("A tecla F5 é utilizada para atualizar uma página da internet ou uma janela do Explorador de Arquivos.",1,"Verdadeiro. F5 recarrega o conteúdo exibido."),
 V("O atalho Ctrl + S serve para salvar um documento ou arquivo.",1,"Verdadeiro. Ctrl+S salva, e vale o hábito de usá-lo com frequência."),
 V("A tecla Windows + E abre o Explorador de Arquivos no sistema Windows.",1,"Verdadeiro. Windows+E é o atalho mais rápido para o Explorador de Arquivos."),
 V("O atalho Ctrl + P é utilizado para imprimir um documento.",1,"Verdadeiro. Ctrl+P abre a janela de impressão (Print).")
);
let i=0;
const card=document.getElementById('card'),pb=document.getElementById('pb'),cnt=document.getElementById('cnt');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
  if(i>=Q.length){
    pb.style.width='100%';cnt.textContent='Concluído';
    card.innerHTML='<div class="end"><h1>🎉 Quiz concluído!</h1><p>Você respondeu todas as '+Q.length+' perguntas corretamente.</p><button class="btn show" id="rs">Recomeçar</button></div>';
    document.getElementById('rs').onclick=()=>{i=0;render()};
    return;
  }
  const d=Q[i];
  pb.style.width=(i/Q.length*100)+'%';
  cnt.textContent='Pergunta '+(i+1)+' de '+Q.length;
  card.innerHTML='<h1>'+esc(d.q)+'</h1><div id="os"></div><div class="com" id="cm"><b>Comentário:</b> '+esc(d.m)+'</div><button class="btn" id="nx">'+(i===Q.length-1?'Finalizar':'Próxima pergunta →')+'</button>';
  const os=document.getElementById('os');
  d.o.forEach((t,k)=>{
    const b=document.createElement('button');
    b.className='opt';b.textContent=String.fromCharCode(65+k)+") "+t;
    b.onclick=()=>{
      if(k===d.c){
        b.classList.add('good');
        os.querySelectorAll('.opt').forEach(x=>x.disabled=true);
        document.getElementById('cm').classList.add('show');
        document.getElementById('nx').classList.add('show');
      }else{
        b.classList.add('bad');b.disabled=true;
      }
    };
    os.appendChild(b);
  });
  document.getElementById('nx').onclick=()=>{i++;render()};
}
render();
</script>
</body>
</html>
